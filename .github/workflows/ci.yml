name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          echo "JWT_SECRET=ci-secret-not-for-production" > .env
          docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/courses || true)
            [ "$code" = "401" ] && exit 0
            sleep 2
          done
          echo "API did not come up"; docker compose logs; exit 1
      - name: Frontend is served
        run: curl -fsS http://localhost:8080 | grep -qi "<div id=\"app\""
      - name: Register and log in
        run: |
          curl -fsS -X POST http://localhost:5000/api/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Student","email":"ci@example.com","student_id":"CI1","password":"pass1234"}'
          curl -fsS -X POST http://localhost:5000/api/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"pass1234"}' | grep -q token
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
